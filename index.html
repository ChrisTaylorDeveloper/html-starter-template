<!DOCTYPE html>
<html lang="en"> <!-- SEO: Always include the lang attribute -->
<head>
    <!-- SEO & Metadata go here (Title, Meta Description, Viewport) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primary Page Title for Search Engines</title>
    
    <!-- Crucial SEO & Sharing Tags -->
    <meta name="description" content="A brief, engaging summary of this page for search engine results.">
    <link rel="canonical" href="https://www.example.com/page">
</head>
<body>

    <header>
        <!-- Site-wide branding, logo, and primary navigation -->
        <nav>
            <!-- SEO: Search engines use <nav> to understand your site's core link structure -->
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- SEO: Exactly ONE <h1> per page representing the main topic -->
        <h1>The Main Subject of This Page</h1>

        <!-- Article for self-contained main content -->
        <article>
            <!-- SEO: The core, unique content of the page. Google relies heavily on <main> -->
            <section>
                <!-- Thematic grouping of content (should include an <h1> or <h2>) -->
                <h2>Understanding Semantic HTML</h2>
                <p>Published on <time datetime="2026-06-06">June 6, 2026</time></p>
                
                <!-- Figure + Figcaption for Image SEO -->
                <figure>
                    <img src="html-structure.png" alt="Diagram showing HTML document tree">
                    <figcaption>Figure 1: Visual layout of semantic tags.</figcaption>
                </figure>
                
                <p>Content goes here...</p>
            </section>

            <section>
                <h2>Another Section Title</h2>
                <p>More content goes here...</p>
            </section>
        </article>

        <!-- Aside for tangential info / sidebar -->
        <aside>
            <h3>Related Articles</h3>
            <ul>
                <li><a href="#">Intro to CSS</a></li>
                <li><a href="#">SEO Best Practices</a></li>
            </ul>
        </aside>
    </main>

    <footer>
        <!-- Footer info, copyright, privacy policy links -->
        <p>&copy; 2026 Company Name</p>
    </footer>

</body>
</html>
